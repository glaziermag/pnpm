name: Open held PR
on:
  push:
    branches: [probe-held]
permissions:
  contents: write
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: probe-held-pr-${{ github.run_id }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout -b "$HEAD_REF"
          date -u > stamp.txt
          git add stamp.txt
          git commit -m "probe stamp"
          git push origin HEAD
          gh pr create --base probe-held --head "$HEAD_REF" --title "probe held run" --body "fork probe, opened with GITHUB_TOKEN"
